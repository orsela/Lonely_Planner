<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f5c43">
<title>הצטרפות לטיול · Lonely Planner</title>
<!-- CHANGE 2026-10-12 F04-NAME-01: display name Plan_Travel → Lonely Planner (title + brand). -->
<!-- Lonely Planner join page · version 3.0.0-alpha.7.2 · FIX-04 (QA-DEBT-BUG-04): fatal() removes the hidden #m first; no duplicate #joinTitle.
     Lonely Planner join page · version 3.0.0-alpha.7 · F06
     CHANGE 2026-10-22 F06-JOIN-01: what changed from 3.0.0-alpha.6: new flag MEMBERS_FEATURE ('on' default). With it on,
     "פתיחת הטיול" also keeps the join code device-wide (pt:_device:join_code:<trip>, spec clarification C5) so that the app can
     offer "בקשה להצטרף שוב" if this member is removed later (docs/F06_spec.md §1.8b).
     A removed identity now gets the normal form from the server (F06 D2), so flow.js's "הוסרת מהטיול" screen is no longer
     reached (kept for an alpha.6 server). D2 is server-side and applies regardless of this flag (spec clarification C1).
     'off' = no code kept (alpha.6).
     Lonely Planner join page · version 3.0.0-alpha.6 · F05
     CHANGE 2026-10-19 F05-JOIN-01: what changed from 3.0.0-alpha.4 (F04-JOIN-01): with JOIN_FEATURE='on' (default) this page
     runs the F05 join flow (docs/F05_spec.md §1.1–1.3, §1.6): it reads the 8-char code from #code=…, keeps it only in
     sessionStorage 'lp:join_code' (so a reload works), removes the hash from the address bar at once (as before), signs the
     browser in anonymously (same origin and auth key as /app/, so the app later sees the same identity), and mounts the
     shared screens from ./flow.js. "פתיחת הטיול" stores the trip as the device's active trip (pt:_device:active_trip) and
     opens ../app/. With JOIN_FEATURE='off' the F04 "בקרוב" page below is shown exactly as before (no network).
     theme-color #0f6b4f → #0f5c43 (the join header colour). -->
<!-- Plan_Travel join page · version 3.0.0-alpha.4 · F04
     CHANGE 2026-10-12 F04-JOIN-01: new file (no previous version). Placeholder for the F05 join flow (docs/F04_spec.md §1.10):
     the join links handed out by the F04 wizard (/join/#code=<CODE>) already work and land here. Outside the app's PWA scope,
     styled like /invite/. It does NOT read, validate or display the code: the #hash is removed from the address bar at once,
     nothing is stored, nothing is sent anywhere (no network request at all). -->
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:#f7f6f1;color:#17211b;font-family:Arial,'Segoe UI',system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:28px 18px;display:flex;flex-direction:column;gap:16px}
.brand{text-align:center;font-size:18px;font-weight:900}
.card{background:#fff;border:1px solid #e4e6df;border-radius:18px;padding:18px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.ring{width:64px;height:64px;border-radius:50%;background:#fef3e2;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:20px}
p{margin:0;font-size:14px;line-height:1.6;color:#3a443d}
#lpRoot{min-height:100vh}
[hidden]{display:none!important}   /* CHANGE 2026-10-19 F05-JOIN-01: main{display:flex} must not override the hidden attribute */
</style>
</head>
<body>
<main id="m">
<div class="brand">Lonely Planner</div>
<section class="card center">
<div class="ring"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8a4a03" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
<h1 id="joinTitle">ההצטרפות לטיול תיפתח בקרוב</h1>
<p>הקישור תקין לשמירה – פתחו אותו שוב בעוד כמה ימים.</p>
</section>
</main>
<div id="lpRoot" hidden></div>
<script>
/* CHANGE 2026-10-19 F05-JOIN-01: flag. 'on' = the F05 join flow; 'off' = the F04 page above, no network, code never read. */
const JOIN_FEATURE='on';
/* CHANGE 2026-10-22 F06-JOIN-01: new flag (no alpha.6 equivalent). 'on' = keep the join code for a later "בקשה להצטרף שוב"; 'off' = alpha.6. */
const MEMBERS_FEATURE='on';
(function(){
'use strict';
const SUPABASE_URL='https://zwufpxnioqaweobnvffs.supabase.co';
const SUPABASE_KEY='sb_publishable_Atuc7ybYTF2o7ujCJBjKjA_So_TbaV8';
const SUPABASE_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
const CODE_KEY='lp:join_code';
const hash=location.hash||'';
/* CHANGE 2026-10-12 F04-JOIN-01 (kept): remove the #code=… hash from the address bar at once */
try{if(hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}
if(JOIN_FEATURE!=='on')return;   /* F04 behaviour: the code is never read, stored or sent */

let code=null;
const m=/[#&]code=([A-Za-z0-9-]+)/.exec(hash);
try{
 if(m){code=m[1];sessionStorage.setItem(CODE_KEY,code)}
 else code=sessionStorage.getItem(CODE_KEY);
}catch(e){if(m)code=m[1]}

document.getElementById('m').hidden=true;
const root=document.getElementById('lpRoot');root.hidden=false;

function load(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
let client=null;
async function getClient(){
 if(client)return client;
 client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const g=await client.auth.getSession();
 if(!(g&&g.data&&g.data.session)){const r=await client.auth.signInAnonymously();if(r.error)throw r.error}
 return client;
}
function enter(tripId,role){
 try{localStorage.setItem('pt:_device:active_trip',JSON.stringify({trip_id:String(tripId),role:role||null}))}catch(e){}
 /* CHANGE 2026-10-22 F06-JOIN-01: new line — the join code is kept device-wide as pt:_device:join_code:<trip> (spec clarification
    C5), read by the app only for "בקשה להצטרף שוב" on screen 1.8b */
 if(MEMBERS_FEATURE==='on'&&code&&window.LPJoin){const c=window.LPJoin.normCode(code);if(c)try{localStorage.setItem('pt:_device:join_code:'+String(tripId),c)}catch(e){}}
 try{sessionStorage.removeItem(CODE_KEY)}catch(e){}
 location.href='../app/';
}
function fatal(){
 /* CHANGE 2026-10-26 FIX-04 (QA-DEBT-BUG-04): what changed from 3.0.0-alpha.7: the hidden F04 placeholder #m is removed first,
    so #joinTitle exists once on the error screen (was: twice). */
 const old=document.getElementById('m');if(old)old.remove();
 root.innerHTML='<main><div class="brand">Lonely Planner</div><section class="card center" role="alert"><h1 id="joinTitle">לא הצלחנו לטעון את הדף</h1>'+
  '<p>בדקו את החיבור ונסו שוב.</p><button type="button" id="lpReload" style="min-height:44px;padding:0 18px;border:0;border-radius:12px;background:#0f6b4f;color:#fff;font-weight:800;font-size:14px">נסו שוב</button></section></main>';
 document.getElementById('lpReload').onclick=()=>location.reload();
}
Promise.all([window.supabase?Promise.resolve():load(SUPABASE_JS),window.LPJoin?Promise.resolve():load('flow.js')])
 .then(()=>window.LPJoin.mount(root,{getClient,fnUrl:SUPABASE_URL+'/functions/v1/join-trip',apiKey:SUPABASE_KEY,code,inApp:false,onEnter:enter}))
 .catch(e=>{console.warn('[join] boot failed',e);fatal()});
})();
</script>
</body>
</html>
