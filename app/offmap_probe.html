<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFFMAP probe</title>
<!-- OFFMAP-PROBE v0.1
CHANGE 2026-11-24 OFFMAP-PROBE-01: new file (no previous version). Standalone feasibility probe for the Protomaps hosted API
(CORS from this origin, tile sizes, request count, rough size of a Romania corridor). NOT linked from the app, NOT in sw.js SHELL_FILES,
no app code touched. The API key is typed on the device and kept in this browser's localStorage only; never written to the repo. -->
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f6f4ef;color:#1d2a24;line-height:1.5}
input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #cfc9b8;width:100%;box-sizing:border-box;margin:6px 0}
button{background:#0f6b4f;color:#fff;border:0;font-weight:700}
pre{background:#fff;border:1px solid #e1ddd2;border-radius:10px;padding:10px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:13px}
</style></head><body>
<h2>OFFMAP · בדיקת היתכנות</h2>
<label>מפתח Protomaps (נשמר רק בדפדפן הזה)</label>
<input id="key" type="password" autocomplete="off" placeholder="הדבק מפתח">
<button id="run">הרץ בדיקה</button>
<pre id="out">מוכן.</pre>
<script>
const $=id=>document.getElementById(id);
const out=[];function log(s){out.push(s);$('out').textContent=out.join('\n')}
try{$('key').value=localStorage.getItem('offmapProbeKey')||''}catch(e){}
const ROUTE=[[44.43,26.10],[45.65,25.60],[45.51,25.37],[46.00,26.00],[46.22,24.79],[45.80,24.15],[44.43,26.10]];
const BUF={6:30,7:30,8:25,9:20,10:15,11:8,12:8,13:3,14:3};
function tileOf(lat,lon,z){const n=2**z,x=Math.floor((lon+180)/360*n),r=lat*Math.PI/180,y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return[x,y]}
function count(z){const set=new Set(),km=40075*Math.cos(45.5*Math.PI/180)/2**z,rad=Math.ceil(BUF[z]/km);
 for(let i=0;i<ROUTE.length-1;i++){const[a,b]=[ROUTE[i],ROUTE[i+1]],steps=Math.ceil(Math.hypot(a[0]-b[0],a[1]-b[1])*111/(km/2))+1;
  for(let s=0;s<=steps;s++){const lat=a[0]+(b[0]-a[0])*s/steps,lon=a[1]+(b[1]-a[1])*s/steps,[x,y]=tileOf(lat,lon,z);
   for(let dx=-rad;dx<=rad;dx++)for(let dy=-rad;dy<=rad;dy++)set.add(x+dx+','+(y+dy))}}return set.size}
async function tile(base,k,z,x,y){const r=await fetch(`${base}/${z}/${x}/${y}.mvt?key=${encodeURIComponent(k)}`);const b=r.ok?await r.arrayBuffer():null;return{ok:r.ok,status:r.status,bytes:b?b.byteLength:0,enc:r.headers.get('content-encoding')}}
$('run').onclick=async()=>{out.length=0;const k=$('key').value.trim();if(!k){log('חסר מפתח');return}
 try{localStorage.setItem('offmapProbeKey',k)}catch(e){}
 log('origin: '+location.origin);let base=null;
 for(const v of['v4','v3']){try{const t=await tile('https://api.protomaps.com/tiles/'+v,k,0,0,0);log(v+' z0: status '+t.status+' bytes '+t.bytes+' enc '+t.enc);if(t.ok){base='https://api.protomaps.com/tiles/'+v;break}}catch(e){log(v+' נכשל (CORS/רשת?): '+e.message)}}
 if(!base){log('אין גישה. בדוק מפתח ו-CORS.');return}
 const avg={};let reqs=1;
 for(const z of[6,8,10,12,14]){const[x0,y0]=tileOf(45.65,25.60,z);let sum=0,n=0;
  for(let dx=-2;dx<=2;dx++)for(let dy=-1;dy<=1;dy++){try{const t=await tile(base,k,z,x0+dx,y0+dy);reqs++;if(t.ok){sum+=t.bytes;n++}}catch(e){}}
  avg[z]=n?sum/n:0;log(`z${z}: ממוצע ${Math.round(avg[z]/1024*10)/10} KB (דגימה ${n} אריחים, סביב בראשוב)`)}
 const zs=Object.keys(BUF).map(Number);let tot=0,tiles=0;
 const interp=z=>{const ks=[6,8,10,12,14];if(z<=6)return avg[6];if(z>=14)return avg[14];for(let i=0;i<4;i++)if(z<=ks[i+1]){const f=(z-ks[i])/(ks[i+1]-ks[i]);return avg[ks[i]]*(1-f)+avg[ks[i+1]]*f}};
 for(const z of zs){const c=count(z),b=c*interp(z);tot+=b;tiles+=c;log(`z${z}: ${c} אריחים ≈ ${Math.round(b/1048576*10)/10} MB`)}
 log(`\nסה"כ מסדרון רומניה (10 ימים, z6–14): ${tiles} אריחים ≈ ${Math.round(tot/1048576)} MB`);
 log('הערה: ממוצע האריח נמדד סביב בראשוב (עירוני); בכפרים האריחים קטנים יותר, כך שזו הערכה גבוהה.');
 if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();log(`מקום פנוי מוערך: ${Math.round((e.quota-e.usage)/1048576)} MB`)}
 log('בקשות בבדיקה: '+reqs+' · תוצאה: '+(base?'עובד':'נכשל'))};
</script></body></html>
