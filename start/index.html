*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:Arial,'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,#eef3ef,#fff 55%,#e3e8e5);color:#2f3a35;display:flex;justify-content:center;padding:28px 20px}
[hidden]{display:none!important}
main{width:100%;max-width:460px;text-align:center;position:relative}
.lang{position:absolute;top:0;inset-inline-start:0;background:#fff;border:1px solid #d5dbd7;border-radius:20px;padding:7px 14px;font-size:14px;font-weight:700;color:#2f7d52;cursor:pointer}
.logo{width:56px;height:56px;margin:34px auto 6px;display:block}
.brand{font-weight:700;font-size:20px;color:#2f7d52;letter-spacing:.5px}

.sub{font-size:18px;line-height:1.5;color:#6b7570}
.steps{margin:28px 0;padding:0;list-style:none;text-align:start}
.steps li{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:18px}
.steps svg{width:38px;height:46px;flex:none}
.cta{display:block;background:#2f7d52;color:#fff;text-decoration:none;font-weight:700;font-size:22px;padding:18px 24px;border-radius:40px;box-shadow:0 6px 18px rgba(47,125,82,.3)}
.cta:active{transform:scale(.98)}
.qr{width:170px;height:170px;margin:26px auto 8px;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(47,58,53,.15)}
.qr svg{width:100%;height:100%;display:block}
.hint{font-size:14px;color:#6b7570}
.scan{display:inline-block;margin-top:14px;background:#fff;border:1.5px solid #3f9b6a;color:#2f7d52;border-radius:30px;padding:11px 22px;font-size:16px;font-weight:700;cursor:pointer}
.scan input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.msg{margin-top:12px;font-size:15px;color:#8a3b2f;min-height:20px}
