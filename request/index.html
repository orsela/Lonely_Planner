/* ---------- months (C3: calendar month in Asia/Jerusalem) ---------- */
function nowYM(){
 try{
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit'}).formatToParts(new Date());
  const y=+p.find(x=>x.type==='year').value,m=+p.find(x=>x.type==='month').value;
  if(y&&m)return{y,m};
 }catch(e){}
 const d=new Date();return{y:d.getFullYear(),m:d.getMonth()+1};
}
function monthList(){
 const s=nowYM(),out=[];
 for(let i=0;i<MONTHS_AHEAD;i++){const k=s.m-1+i,y=s.y+Math.floor(k/12),m=k%12+1;out.push({v:y+'-'+(m<10?'0':'')+m+'-01',y,m})}
 return out;
}
function monthLabel(v){const m=/^(\d{4})-(\d{2})-01$/.exec(String(v||''));return m?tx().months[+m[2]-1]+' '+m[1]:''}

/* ---------- countries (../app/countries.json) ---------- */
function loadCountries(){
 if(S.list)return Promise.resolve(S.list);
 if(S.listP)return S.listP;
 S.listP=fetch(COUNTRIES_URL,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()})
  .then(a=>{S.list=(Array.isArray(a)?a:[]).filter(c=>c&&/^[A-Z]{2}$/.test(c.code));return S.list})
  .catch(e=>{S.listP=null;throw e});

}
function cByCode(code){return(S.list||[]).find(c=>c.code===code)||null}
function cName(code){const c=cByCode(code);return c?(c[S.lang]||c.en||code):code}
function cFlag(code){const c=cByCode(code);return c&&c.flag?c.flag:''}
function matches(q){
 const L=S.list||[],lang=S.lang;q=String(q||'').trim().toLowerCase();
 const pool=L.filter(c=>S.f.countries.indexOf(c.code)<0);
 let res;
 if(!q)res=pool.filter(c=>c.popular);
 else res=pool.filter(c=>String(c.he||'').toLowerCase().indexOf(q)>=0||String(c.en||'').toLowerCase().indexOf(q)>=0||c.code.toLowerCase()===q);
 const nm=c=>String(c[lang]||c.en||'');
 const starts=c=>q&&(String(c.he||'').toLowerCase().indexOf(q)===0||String(c.en||'').toLowerCase().indexOf(q)===0||c.code.toLowerCase()===q)?0:1;
 res.sort((a,b)=>(starts(a)-starts(b))||((b.popular?1:0)-(a.popular?1:0))||nm(a).localeCompare(nm(b),lang));
 return res.slice(0,8);
}

function call(body){

 const ac=typeof AbortController!=='undefined'?new AbortController():null;
 const t=setTimeout(()=>{try{ac&&ac.abort()}catch(e){}},CALL_TIMEOUT_MS);
 return fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify(body),signal:ac?ac.signal:undefined,cache:'no-store'})
  .then(r=>r.json().then(j=>j&&typeof j==='object'?j:{ok:false,code:'server_error'},()=>({ok:false,code:'server_error'})))
  .catch(()=>({ok:false,code:online()?'network':'offline'}))
  .finally(()=>clearTimeout(t));
}

 let o=null;try{o=JSON.parse(raw)}catch(e){o=null}

}

  return '<span class="rq-chip" data-code="'+code+'"><span>'+(fl?esc(fl)+' ':'')+esc(n)+'</span><button type="button" data-rm="'+code+'" aria-label="'+esc(tx().remove+n)+'">×</button></span>'}).join('');
 box.querySelectorAll('button[data-rm]').forEach(b=>{b.onclick=()=>{
  const i=S.f.countries.indexOf(b.dataset.rm);if(i>=0)S.f.countries.splice(i,1);
  paintChips();liveCountriesErr();const w=$('rqWhere');if(w)try{w.focus({preventScroll:true})}catch(e){}
 }});
}
function addCountry(code){
 if(S.f.countries.indexOf(code)<0)S.f.countries.push(code);
 const w=$('rqWhere');if(w){w.value='';try{w.focus({preventScroll:true})}catch(e){}}
 paintChips();paintList();liveCountriesErr();
}
function liveCountriesErr(){const n=S.f.countries.length;setErr('countries',n>10?tx().eCountries11:'')}
function fieldEl(k){return $({name:'rqName',email:'rqEmail',countries:'rqWhere',month:'rqWhen',travellers:'rqCount',note:'rqNote',ts:'rqTurnstile'}[k])}
function setErr(k,msg){
 const box=$('rq'+k.charAt(0).toUpperCase()+k.slice(1)+'ErrBox'),el=fieldEl(k);
 if(!box)return;
 box.innerHTML=errHtml('rq'+k.charAt(0).toUpperCase()+k.slice(1)+'Err',msg);
 if(el&&el.tagName!=='DIV'){if(msg)el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid')}
}
function collect(){
 const f=S.f,v=id=>{const e=$(id);return e?e.value:''};
 if(!$('rqName'))return;
 f.name=String(v('rqName')).trim().replace(/\s+/g,' ');
 f.email=String(v('rqEmail')).trim().toLowerCase();
 f.month=v('rqWhen');f.unsure=!!($('rqUnsure')&&$('rqUnsure').checked);
 const n=String(v('rqCount')).trim();f.travellers=/^\d+$/.test(n)?parseInt(n,10):NaN;
 f.note=String(v('rqNote'));
}
function validEmail(e){return e.length<=254&&/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(e)}
function validate(){
 const f=S.f,t=tx(),errs={};
 if(!f.name||f.name.length>40)errs.name=t.eName;
 if(!validEmail(f.email))errs.email=t.eEmail;
 if(f.countries.length<1)errs.countries=t.eCountries0;else if(f.countries.length>10)errs.countries=t.eCountries11;
 if(!f.unsure&&!monthList().some(m=>m.v===f.month))errs.month=t.eMonth;
 if(!(Number.isInteger(f.travellers)&&f.travellers>=1&&f.travellers<=30))errs.travellers=t.eCount;
 if(f.note.length>200)errs.note=t.eNote;
 return errs;
}
const ORDER=['name','email','countries','month','travellers','note'];
function showErrs(errs){
 ORDER.forEach(k=>setErr(k,errs[k]||''));
 const first=ORDER.find(k=>errs[k]);
 if(first){const el=fieldEl(first);if(el)try{el.focus();el.scrollIntoView({block:'center'})}catch(e){}}
 return !!first;
}
function setBusy(id,busy,label){const b=$(id);if(b){b.disabled=!!busy;b.textContent=label}}
async function submit(){
 if(S.busy)return;
 collect();
 setErr('ts','');
 if(showErrs(validate()))return;
 if(!online()){toast(tx().tOffline);return}
 if(!S.tsToken){setErr('ts',tx().eTs);if(!window.turnstile)mountTurnstile();return}
 const f=S.f,body={action:'start',lang:S.lang,name:f.name,email:f.email,countries:f.countries.slice(),month:f.unsure?null:f.month,
  travellers:f.travellers,note:f.note.trim()?f.note.trim():null,turnstile_token:S.tsToken};
 S.busy=true;setBusy('rqSend',true,tx().sending);
 const r=await call(body);
 S.busy=false;
 S.tsToken='';   /* a Turnstile token is single-use */
 if(r.ok===true&&r.request_id){
  S.rq={id:String(r.request_id),email:f.email,sentAt:Date.now(),lang:S.lang};S.resumed=false;S.codeErr='';S.codeBad=false;
  writeResume();removeTurnstile();showCode();return;
 }
 setBusy('rqSend',false,tx().send);
 resetTurnstile();
 const c=r.code;
 if(c==='daily_limit'){removeTurnstile();showLimit();return}
 if(c==='turnstile_failed'){toast(tx().tTs);return}
 if(c==='invalid_request'&&r.field&&ORDER.indexOf(r.field)>=0){const e={};e[r.field]=fieldMsg(r.field);showErrs(e);return}
 if(c==='invalid_request'&&r.field==='travelers'){showErrs({travellers:tx().eCount});return}
 genericToast(c);
}
function fieldMsg(k){const t=tx();return{name:t.eName,email:t.eEmail,countries:S.f.countries.length>10?t.eCountries11:t.eCountries0,month:t.eMonth,travellers:t.eCount,note:t.eNote}[k]}

/* ---------- Turnstile (managed, explicit render, language = page language) ---------- */
function mountTurnstile(){
 const box=$('rqTurnstile');if(!box)return;
 if(window.turnstile&&typeof window.turnstile.render==='function'){renderTurnstile();return}
 if(S.tsLoading)return;
 S.tsLoading=true;
 window.rqTurnstileReady=()=>{S.tsLoading=false;renderTurnstile()};
 const s=document.createElement('script');s.src=TS_SRC;s.async=true;s.defer=true;
 s.onerror=()=>{S.tsLoading=false;try{s.remove()}catch(e){}};
 document.head.appendChild(s);
}
function renderTurnstile(){
 const box=$('rqTurnstile');if(!box||!window.turnstile)return;
 removeTurnstile();
 S.tsToken='';
 try{
  S.tsId=window.turnstile.render(box,{sitekey:TURNSTILE_SITE_KEY,language:S.lang,theme:'light',
   callback:tok=>{S.tsToken=String(tok||'');setErr('ts','')},
   'expired-callback':()=>{S.tsToken=''},
   'error-callback':()=>{S.tsToken=''}});
 }catch(e){S.tsId=null}
}
function resetTurnstile(){S.tsToken='';if(window.turnstile&&S.tsId!=null){try{window.turnstile.reset(S.tsId)}catch(e){}}}
function removeTurnstile(){if(window.turnstile&&S.tsId!=null){try{window.turnstile.remove(S.tsId)}catch(e){}}S.tsId=null;S.tsToken=''}

/* ---------- 1.3 code ---------- */
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function showCode(){
 const t=tx(),rq=S.rq;
 const boxes=[0,1,2,3,4,5].map(i=>'<input class="rq-otp" id="rqOtp'+i+'" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="'+(i===0?6:1)+'" aria-label="'+esc(t.digit+(i+1))+'" autocomplete="'+(i===0?'one-time-code':'off')+'">').join('');
 paint('code','<div class="rq-bar">'+topRow()+'<h1 class="rq-h1" id="rqTitle">'+t.codeT+'</h1>'+
  '<p class="rq-lead">'+esc(t.codeLead1)+'<b dir="ltr" id="rqCodeEmail">'+esc(rq.email)+'</b>'+esc(t.codeLead2)+'</p></div>'+
  '<div class="rq-pad">'+
  (S.resumed?'<p class="rq-banner" id="rqResumed" role="status"'+(online()?'':' hidden')+'>'+esc(t.resumed(Math.max(1,Math.floor((Date.now()-rq.sentAt)/60000))))+'</p>':'')+
  '<div><span class="rq-lbl" id="rqCodeLbl">'+t.codeLbl+'</span><div class="rq-otp-row'+(S.codeBad?' bad':'')+'" id="rqOtpRow" role="group" aria-labelledby="rqCodeLbl">'+boxes+'</div>'+
  '<p class="rq-codeerr" id="rqCodeErr" role="alert"'+(S.codeErr?'':' hidden')+'>'+esc(S.codeErr)+'</p>'+
  '<p class="rq-tiny">'+esc(t.codeHelp1)+'<br>'+esc(t.codeHelp2)+'</p></div>'+
  '<section class="rq-where"><b>'+t.whereT+'</b><div class="rq-notif" aria-hidden="true"><div class="ic">'+ICON.mail+'</div><div class="tx"><div class="from">Lonely Planner · '+t.now+'</div>'+
   '<div class="subj"><span dir="ltr">••••••</span>'+esc(t.subj)+'</div></div></div></section>'+
  '<div class="rq-links"><button type="button" class="rq-link" id="rqResend" disabled>'+esc(t.resend)+'</button><span class="rq-dot" aria-hidden="true">·</span>'+
  '<button type="button" class="rq-link" id="rqFix">'+esc(t.fix)+'</button></div>'+
  '<p class="rq-tiny" style="margin:0 4px;font-size:12px">'+esc(t.codeFoot)+'</p></div>'+
  '<div class="rq-foot"><button type="button" class="rq-btn" id="rqVerify" disabled>'+esc(t.verify)+'</button></div>');
 const ins=otpInputs();
 ins.forEach((inp,i)=>{
  inp.addEventListener('input',()=>{
   const v=String(inp.value||'').replace(/\D/g,'');
   if(v.length>1){fillFrom(i,v);return}
   inp.value=v;clearCodeErr();
   if(v&&i<5)ins[i+1].focus();
   paintVerify();autoSubmit();
  });
  inp.addEventListener('keydown',e=>{
   if(e.key==='Backspace'&&!inp.value&&i>0){e.preventDefault();ins[i-1].value='';ins[i-1].focus();paintVerify()}
   else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();ins[i-1].focus()}
   else if(e.key==='ArrowRight'&&i<5){e.preventDefault();ins[i+1].focus()}
   else if(e.key==='Enter'){e.preventDefault();verify()}
  });
  inp.addEventListener('paste',e=>{
   const cd=e.clipboardData||window.clipboardData;
   const d=String(cd&&cd.getData('text')||'').replace(/\D/g,'');
   if(d){e.preventDefault();fillFrom(d.length>=6?0:i,d)}
  });
  inp.addEventListener('focus',()=>{try{inp.select()}catch(e){}});
 });
 $('rqVerify').onclick=verify;
 $('rqResend').onclick=resend;
 $('rqFix').onclick=()=>{clearResume();const em=S.rq&&S.rq.email;S.rq=null;S.resumed=false;S.codeErr='';S.codeBad=false;if(!S.f.email&&em)S.f.email=em;showForm();const e=$('rqEmail');if(e)try{e.focus()}catch(x){}};
 paintCooldown();
 S.timer=setInterval(paintCooldown,1000);
 try{ins[0].focus({preventScroll:true})}catch(e){}
}
function otpInputs(){return[0,1,2,3,4,5].map(i=>$('rqOtp'+i)).filter(Boolean)}
function codeValue(){return otpInputs().map(x=>x.value).join('')}
function fillFrom(i,v,quiet){
 const ins=otpInputs();if(!ins.length)return;
 const d=String(v).replace(/\D/g,'').slice(0,6-i).split('');
 d.forEach((x,k)=>{ins[i+k].value=x});
 if(!quiet)clearCodeErr();
 const nx=Math.min(5,i+d.length);try{ins[nx].focus()}catch(e){}
 paintVerify();if(!quiet)autoSubmit();
}
function clearCodeErr(){if(!S.codeErr&&!S.codeBad)return;S.codeErr='';S.codeBad=false;const e=$('rqCodeErr');if(e){e.hidden=true;e.textContent=''}const r=$('rqOtpRow');if(r)r.classList.remove('bad')}
function setCodeErr(msg,bad){S.codeErr=msg;S.codeBad=!!bad;const e=$('rqCodeErr');if(e){e.textContent=msg;e.hidden=!msg}const r=$('rqOtpRow');if(r)r.classList.toggle('bad',!!bad)}
function paintVerify(){const b=$('rqVerify');if(b)b.disabled=S.busy||!/^\d{6}$/.test(codeValue())}
function autoSubmit(){const v=codeValue();if(/^\d{6}$/.test(v)&&v!==S.lastAuto){S.lastAuto=v;verify()}}
function paintCooldown(){
 const b=$('rqResend');if(!b||!S.rq)return;
 const left=S.rq.expired?0:Math.ceil((S.rq.sentAt+RESEND_S*1000-Date.now())/1000);
 if(left>0){const m=Math.floor(left/60),s=left%60;b.disabled=true;b.textContent=tx().resendIn+m+':'+(s<10?'0':'')+s}
 else{b.disabled=S.busy;b.textContent=tx().resend}
 const rb=$('rqResumed');if(rb)rb.hidden=!online();
}
function restart(msgKey){
 /* code_locked / request_unknown: the request row is gone → back to the form (values kept when they are in memory) */
 clearResume();const em=S.rq&&S.rq.email;S.rq=null;S.resumed=false;S.codeErr='';S.codeBad=false;S.lastAuto='';
 if(!S.f.email&&em)S.f.email=em;
 showForm();toast(tx()[msgKey]);
}
async function verify(){
 if(S.busy||!S.rq)return;
 const code=codeValue();
 if(!/^\d{6}$/.test(code))return;
 if(!online()){toast(tx().tOffline);return}
 S.busy=true;setBusy('rqVerify',true,tx().verifying);
 const r=await call({action:'verify',request_id:S.rq.id,code});
 S.busy=false;
 if(S.screen!=='code')return;
 setBusy('rqVerify',false,tx().verify);paintVerify();
 if(r.ok===true){clearResume();S.sent={rq:S.rq,f:S.hasForm?JSON.parse(JSON.stringify(S.f)):null,server:r.request||null};S.rq=null;S.resumed=false;showSent();return}
 const c=r.code;
 if(c==='code_wrong'){const n=Number(r.attempts_left);setCodeErr(Number.isFinite(n)?tx().cWrong(n):tx().cWrong0,true);return}
 if(c==='code_expired'){S.rq.expired=true;setCodeErr(tx().cExpired,false);paintCooldown();return}
 if(c==='code_locked'){restart('tLocked');return}
 if(c==='request_unknown'){restart('tUnknown');return}
 S.lastAuto='';
 genericToast(c);
}
async function resend(){
 if(S.busy||!S.rq)return;
 if(!online()){toast(tx().tOffline);return}
 S.busy=true;const b=$('rqResend');if(b)b.disabled=true;
 const r=await call({action:'resend',request_id:S.rq.id});
 S.busy=false;
 if(S.screen!=='code')return;
 if(r.ok===true){
  S.rq.sentAt=Date.now();S.rq.expired=false;S.lastAuto='';writeResume();
  otpInputs().forEach(x=>{x.value=''});clearCodeErr();paintVerify();paintCooldown();toast(tx().tResent);
  try{otpInputs()[0].focus()}catch(e){}
  return;
 }
 const c=r.code;
 if(c==='daily_limit'){showLimit();return}
 if(c==='code_locked'){restart('tLocked');return}
 if(c==='request_unknown'){restart('tUnknown');return}
 paintCooldown();genericToast(c);
}
window.addEventListener('online',()=>{if(S.screen==='code')paintCooldown()});
window.addEventListener('offline',()=>{if(S.screen==='code')paintCooldown()});

/* ---------- 1.4 daily cap ---------- */
function showLimit(){
 const t=tx();
 paint('limit','<div class="rq-bar">'+topRow()+'</div>'+
  '<div class="rq-center" style="padding-top:40px"><div class="rq-ring" style="background:#fef3e2">'+ICON.clock+'</div><h1 id="rqTitle">'+t.limT+'</h1><p>'+t.limP+'</p></div>'+
  '<div class="rq-pad" style="padding-top:24px"><section class="rq-card rq-ticks"><div class="rq-tick">'+ICON.tick+'<span>'+t.lim1+'</span></div><div class="rq-tick">'+ICON.tick+'<span>'+t.lim2+'</span></div></section>'+
  '<button type="button" class="rq-btn out" id="rqBack">'+esc(t.back)+'</button></div>');
 $('rqBack').onclick=()=>{if(S.rq&&!S.rq.email)S.rq=null;showForm()};
}

/* ---------- 1.5 sent ---------- */
function showSent(){
 const t=tx(),sn=S.sent||{},f=sn.f,sv=sn.server||{};
 const countries=f?f.countries:(Array.isArray(sv.countries)?sv.countries:null);
 const month=f?(f.unsure?null:f.month):(sv.month!==undefined?sv.month:undefined);
 const trav=f?f.travellers:(sv.travellers!=null?sv.travellers:null);
 const email=(sn.rq&&sn.rq.email)||(f&&f.email)||'';
 const rows=[];
 if(countries&&countries.length)rows.push('<div class="rq-row"><span>'+t.rWhere+'</span><b id="rqSumWhere">'+countries.map(c=>esc((cFlag(c)?cFlag(c)+' ':'')+cName(c))).join(t.sep)+'</b></div>');
 if(month!==undefined)rows.push('<div class="rq-row"><span>'+t.rWhen+'</span><b id="rqSumWhen">'+esc(month?monthLabel(String(month).slice(0,7)+'-01'):t.notSure)+'</b></div>');
 if(trav!=null)rows.push('<div class="rq-row"><span>'+t.rCount+'</span><b id="rqSumCount">'+esc(trav)+'</b></div>');
 rows.push('<div class="rq-row"><span>'+t.rEmail+'</span><b dir="ltr" id="rqSumEmail">'+esc(email)+'</b></div>');
 paint('sent','<div class="rq-bar">'+topRow()+'</div>'+
  '<div class="rq-center"><div class="rq-ring" style="background:#edf8f3">'+ICON.big+'</div><h1 id="rqTitle">'+t.sentT+'</h1><p>'+t.sentP+'</p></div>'+
  '<div class="rq-pad"><section class="rq-card" style="padding:8px 16px">'+rows.join('')+'</section>'+
  '<section class="rq-card rq-steps"><b>'+t.nowT+'</b>'+
  '<div class="rq-tick"><span class="rq-n">1</span><span>'+t.s1+'</span></div>'+
  '<div class="rq-tick"><span class="rq-n">2</span><span>'+t.s2+'</span></div>'+
  '<div class="rq-tick"><span class="rq-n">3</span><span>'+t.s3+'</span></div></section></div>');
 if(countries&&countries.length&&!S.list)loadCountries().then(()=>{if(S.screen==='sent')showSent()}).catch(()=>{});
}

/* ---------- boot ---------- */
const res=readResume();
if(res){
 if(!linkLang()&&(res.lang==='he'||res.lang==='en'))S.lang=res.lang;
 S.rq={id:res.request_id,email:res.email,sentAt:res.sentAt,lang:res.lang};S.resumed=true;
 showCode();
}else if(IN_APP&&(IS_IOS||IS_ANDROID)&&!S.inAppDone){
 showInApp(false);
}else showForm();
})();
</script>
</body>
</html>
