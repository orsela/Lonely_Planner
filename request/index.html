     CHANGE 2026-11-13 F23-REQ-01: what changed from 3.0.0-alpha.8 (claude/Plan_Travel_F23_spec.md, mockup row 17 artboards
     FB_Request, FB_Suggest, FB_Ready):
       (1) flag REQUEST_MODE 'auto' | 'manual'. auto: new subtitle + three "what we do / don't" lines in the hero (D1), no
           "if approved" wording, and after the email code the page goes straight to the new "ready" screen with the
           button to the trip wizard (/invite/#invite=<token>, D2). manual = the alpha.8 page text for text.
       (2) flag SUGGEST_FEATURE 'on' | 'off'. on: "לאן?" gets the choice "יודע/ת לאן" / "עוד לא החלטתי" (C9); undecided
           asks for interests, max flight time and a short note, and after the code the new "suggest" screen shows up to
           3 AI destination ideas (refresh twice), or the regular country picker when ideas are unavailable (C8).
           off = no choice, the alpha.8 form.
       What the server answers decides the screen after the code (next: 'ready' | 'suggest' | none), not the flags.
     New device key (sessionStorage, this tab only): pt:_device:rq_ready — the ready screen's data incl. the invite token,
     so a reload of the tab does not lose the way into the wizard. pt:_device:rq_resume gains `u` (1 = undecided).
     New stable ids for QA: #rqApp[data-screen = … suggest|ready], #rqWhat, #rqSegKnown, #rqSegUnd, #rqKnownBox, #rqUndBox,
     #rqInts (buttons [data-int]), #rqFlight, #rqPref, #rqInterestsErr, #rqPrefErr, #rqNoteBox, #rqSgList (cards
     [data-country], buttons [data-pick]), #rqSgMore, #rqSgGo, #rqSgRetry, #rqSgFallback, #rqPick, #rqPickList, #rqSgLoading,
     #rqStart, #rqReadyMail, #rqSumWhere / #rqSumWhen / #rqSumCount (ready screen too).

     Lonely Planner request page · version 3.0.0-alpha.8 · F21

     anyone asks to open a trip (docs/F21_spec.md §1.0–§1.5; artboards F21_InApp, F21_Request, F21_RequestEN, F21_Limit,

     pt:_device:rq_lang (the chosen language) and pt:_device:rq_resume ({request_id, email, sentAt, lang, v:1} — never the

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function online(){return navigator.onLine!==false}

/* ---------- language (§1.0): link → stored choice → device ---------- */
function linkLang(){
 let l='';
 try{l=new URLSearchParams(location.search).get('lang')||''}catch(e){}
 if(!l){const m=/[#&]lang=(he|en)\b/.exec(String(location.hash||''));if(m)l=m[1]}
 return l==='he'||l==='en'?l:'';
}
function deviceLang(){
 const ls=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']).map(x=>String(x||'').toLowerCase());
 return ls.some(x=>/^(he|iw)(-|$)/.test(x))?'he':'en';
}
function storedLang(){const v=lsGet(LANG_KEY);return v==='he'||v==='en'?v:''}

/* ---------- months (C3: calendar month in Asia/Jerusalem) ---------- */
function nowYM(){
 try{
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit'}).formatToParts(new Date());
  const y=+p.find(x=>x.type==='year').value,m=+p.find(x=>x.type==='month').value;
  if(y&&m)return{y,m};
 }catch(e){}
 const d=new Date();return{y:d.getFullYear(),m:d.getMonth()+1};
}
function monthList(){
 const s=nowYM(),out=[];
 for(let i=0;i<MONTHS_AHEAD;i++){const k=s.m-1+i,y=s.y+Math.floor(k/12),m=k%12+1;out.push({v:y+'-'+(m<10?'0':'')+m+'-01',y,m})}
 return out;
}
function monthLabel(v){const m=/^(\d{4})-(\d{2})-01$/.exec(String(v||''));return m?tx().months[+m[2]-1]+' '+m[1]:''}

/* ---------- countries (../app/countries.json) ---------- */
function loadCountries(){
 if(S.list)return Promise.resolve(S.list);
 if(S.listP)return S.listP;
 S.listP=fetch(COUNTRIES_URL,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()})
  .then(a=>{S.list=(Array.isArray(a)?a:[]).filter(c=>c&&/^[A-Z]{2}$/.test(c.code));return S.list})
  .catch(e=>{S.listP=null;throw e});

}
function cByCode(code){return(S.list||[]).find(c=>c.code===code)||null}
function cName(code){const c=cByCode(code);return c?(c[S.lang]||c.en||code):code}
function cFlag(code){const c=cByCode(code);return c&&c.flag?c.flag:''}
function matches(q){
 const L=S.list||[],lang=S.lang;q=String(q||'').trim().toLowerCase();
 const pool=L.filter(c=>S.f.countries.indexOf(c.code)<0);
 let res;
 if(!q)res=pool.filter(c=>c.popular);
 else res=pool.filter(c=>String(c.he||'').toLowerCase().indexOf(q)>=0||String(c.en||'').toLowerCase().indexOf(q)>=0||c.code.toLowerCase()===q);
 const nm=c=>String(c[lang]||c.en||'');
 const starts=c=>q&&(String(c.he||'').toLowerCase().indexOf(q)===0||String(c.en||'').toLowerCase().indexOf(q)===0||c.code.toLowerCase()===q)?0:1;
 res.sort((a,b)=>(starts(a)-starts(b))||((b.popular?1:0)-(a.popular?1:0))||nm(a).localeCompare(nm(b),lang));
 return res.slice(0,8);
}

/* ---------- network ---------- */
function call(body){
 if(!online())return Promise.resolve({ok:false,code:'offline'});
 const ac=typeof AbortController!=='undefined'?new AbortController():null;
 const t=setTimeout(()=>{try{ac&&ac.abort()}catch(e){}},CALL_TIMEOUT_MS);
 return fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify(body),signal:ac?ac.signal:undefined,cache:'no-store'})
  .then(r=>r.json().then(j=>j&&typeof j==='object'?j:{ok:false,code:'server_error'},()=>({ok:false,code:'server_error'})))
  .catch(()=>({ok:false,code:online()?'network':'offline'}))
  .finally(()=>clearTimeout(t));
}
function genericToast(code){toast(code==='offline'?tx().tOffline:code==='rate_limited'?tx().tRate:tx().tGeneric)}

/* ---------- resume (F04-HOME §3.3 pattern; never the code) ---------- */
function readResume(){
 const raw=lsGet(RESUME_KEY);if(!raw)return null;
 let o=null;try{o=JSON.parse(raw)}catch(e){o=null}
 if(!o||o.v!==1||typeof o.request_id!=='string'||!o.request_id||typeof o.email!=='string'||typeof o.sentAt!=='number'){lsDel(RESUME_KEY);return null}
 const age=Date.now()-o.sentAt;
 if(age>=RESUME_TTL_MS||age<-60000){lsDel(RESUME_KEY);return null}
 return o;
}
/* CHANGE 2026-11-13 F23-REQ-08: + u (1 = the request was sent as "undecided"; verify needs it after a reload). Was without it. */
function writeResume(){if(S.rq)lsSet(RESUME_KEY,JSON.stringify({request_id:S.rq.id,email:S.rq.email,sentAt:S.rq.sentAt,lang:S.rq.lang,u:S.rq.und?1:0,v:1}))}

function collect(){
 const f=S.f,v=id=>{const e=$(id);return e?e.value:''};
 if(!$('rqName'))return;
 f.name=String(v('rqName')).trim().replace(/\s+/g,' ');
 f.email=String(v('rqEmail')).trim().toLowerCase();
 f.month=v('rqWhen');f.unsure=!!($('rqUnsure')&&$('rqUnsure').checked);
 const n=String(v('rqCount')).trim();f.travellers=/^\d+$/.test(n)?parseInt(n,10):NaN;
 f.note=String(v('rqNote'));
 /* CHANGE 2026-11-13 F23-REQ-12: + the undecided fields (interests live in S.f already) */
 if($('rqPref'))f.pref=String(v('rqPref')).trim().replace(/\s+/g,' ');
 if($('rqFlight'))f.maxFlight=v('rqFlight')||'5';
}
function isUnd(){return SUG&&S.f.whereMode==='undecided'}
function validEmail(e){return e.length<=254&&/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(e)}
function validate(){
 const f=S.f,t=tx(),errs={};
 if(!f.name||f.name.length>40)errs.name=t.eName;
 if(!validEmail(f.email))errs.email=t.eEmail;
 /* CHANGE 2026-11-13 F23-REQ-12: undecided → interests (≥1) and the short note (≤100) instead of the countries and the
    long note; known → the alpha.8 checks, unchanged. */
 if(isUnd()){
  if(f.interests.length<1)errs.interests=t.eInterests;
  if(f.pref.length>100)errs.pref=t.ePref;
 }else
 if(f.countries.length<1)errs.countries=t.eCountries0;else if(f.countries.length>10)errs.countries=t.eCountries11;
 if(!f.unsure&&!monthList().some(m=>m.v===f.month))errs.month=t.eMonth;
 if(!(Number.isInteger(f.travellers)&&f.travellers>=1&&f.travellers<=30))errs.travellers=t.eCount;
 if(!isUnd()&&f.note.length>200)errs.note=t.eNote;   /* CHANGE 2026-11-13 F23-REQ-12: the hidden long note is not checked while undecided */
 return errs;
}
const ORDER=['name','email','countries','interests','pref','month','travellers','note'];   /* CHANGE 2026-11-13 F23-REQ-12: + interests, pref */

}

    (C9). A known request sends exactly the alpha.8 body. */
 const und=isUnd();
 const f=S.f,body=und?{action:'start',lang:S.lang,name:f.name,email:f.email,where_mode:'undecided',interests:f.interests.slice(),max_flight:f.maxFlight,
   pref_note:f.pref?f.pref:null,month:f.unsure?null:f.month,travellers:f.travellers,note:null,turnstile_token:S.tsToken}
  :{action:'start',lang:S.lang,name:f.name,email:f.email,countries:f.countries.slice(),month:f.unsure?null:f.month,
  travellers:f.travellers,note:f.note.trim()?f.note.trim():null,turnstile_token:S.tsToken};
 S.busy=true;setBusy('rqSend',true,tx().sending);
 const r=await call(body);
 S.busy=false;

 if(r.ok===true&&r.request_id){

function clearCodeErr(){if(!S.codeErr&&!S.codeBad)return;S.codeErr='';S.codeBad=false;const e=$('rqCodeErr');if(e){e.hidden=true;e.textContent=''}const r=$('rqOtpRow');if(r)r.classList.remove('bad')}
function setCodeErr(msg,bad){S.codeErr=msg;S.codeBad=!!bad;const e=$('rqCodeErr');if(e){e.textContent=msg;e.hidden=!msg}const r=$('rqOtpRow');if(r)r.classList.toggle('bad',!!bad)}

async function verify(){
 if(S.busy||!S.rq)return;
 const code=codeValue();
 if(!/^\d{6}$/.test(code))return;
 if(!online()){toast(tx().tOffline);return}
 S.busy=true;setBusy('rqVerify',true,tx().verifying);
 /* CHANGE 2026-11-13 F23-REQ-15: + undecided:true for an undecided request; the answer's `next` picks the screen —
    'suggest' → the ideas, 'ready' → straight to the wizard button, none → the alpha.8 "request sent". */
 const r=await call(S.rq.und?{action:'verify',request_id:S.rq.id,code,undecided:true}:{action:'verify',request_id:S.rq.id,code});
 S.busy=false;
 if(S.screen!=='code')return;
 setBusy('rqVerify',false,verifyLbl());paintVerify();
 if(r.ok===true&&r.next==='suggest'&&TOKEN_RE.test(String(r.token||''))){clearResume();startSuggest(r);return}
 if(r.ok===true&&r.next==='ready'&&TOKEN_RE.test(String(r.invite_token||''))){clearResume();S.rq=null;S.resumed=false;toReady(r);return}
 if(r.ok===true){clearResume();S.sent={rq:S.rq,f:S.hasForm?JSON.parse(JSON.stringify(S.f)):null,server:r.request||null};S.rq=null;S.resumed=false;showSent();return}

 if(c==='code_expired'){S.rq.expired=true;resetOtp();setCodeErr(tx().cExpired,false);paintCooldown();return}
 if(c==='code_locked'){restart('tLocked');return}
 if(c==='request_unknown'){restart('tUnknown');return}
 S.lastAuto='';
 genericToast(c);
}

/* ---------- F23: suggestions (artboard FB_Suggest) ---------- */
/* CHANGE 2026-11-13 F23-REQ-16: new section (no alpha.8 equivalent). After the code of an undecided request: up to 3 AI
   ideas, 2 refreshes (D4), pick one → choose. When ideas are unavailable (C8) the regular country picker, and the flow
   continues. The session token lives in memory only; the server accepts it for 30 minutes. */
function startSuggest(r){
 const f=S.hasForm?S.f:null,left=Number(r.left);
 S.sg={id:S.rq.id,token:String(r.token),email:S.rq.email,left:Number.isFinite(left)?left:3,items:null,pick:'',fallback:false,loading:false,err:false,busy:false,
  sum:f?{month:f.unsure?'':f.month,travellers:f.travellers,interests:f.interests.slice(),maxFlight:f.maxFlight}:null};
 S.rq=null;S.resumed=false;
 loadCountries().catch(()=>{});
 fetchSuggest();
}
function callLong(body){
 /* suggest waits for the model (≤10 s on the server) → a longer limit than the other calls */
 if(!online())return Promise.resolve({ok:false,code:'offline'});
 const ac=typeof AbortController!=='undefined'?new AbortController():null;
 const t=setTimeout(()=>{try{ac&&ac.abort()}catch(e){}},SUGGEST_TIMEOUT_MS);
 return fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify(body),signal:ac?ac.signal:undefined,cache:'no-store'})
  .then(r=>r.json().then(j=>j&&typeof j==='object'?j:{ok:false,code:'server_error'},()=>({ok:false,code:'server_error'})))
  .catch(()=>({ok:false,code:online()?'network':'offline'}))
  .finally(()=>clearTimeout(t));
}
function cleanItems(a){
 const seen={},out=[];
 (Array.isArray(a)?a:[]).forEach(x=>{
  const c=x&&typeof x.country==='string'?x.country.toUpperCase():'';
  if(!/^[A-Z]{2}$/.test(c)||seen[c]||out.length>=3)return;
  seen[c]=1;out.push({country:c,reason:String(x.reason||'').slice(0,140),tags:(Array.isArray(x.tags)?x.tags:[]).slice(0,3).map(t=>String(t).slice(0,20)).filter(Boolean)});
 });
 return out;
}
async function fetchSuggest(){
 const g=S.sg;if(!g||g.loading)return;
 g.loading=true;g.err=false;showSuggest();
 const r=await callLong({action:'suggest',request_id:g.id,token:g.token});
 if(S.sg!==g)return;
 g.loading=false;
 if(r.ok===true){
  const items=cleanItems(r.items),left=Number(r.left);
  if(Number.isFinite(left))g.left=Math.max(0,left);
  if(items.length&&r.fallback!==true){g.items=items;g.pick='';g.fallback=false}
  else if(!g.items)g.fallback=true;            /* nothing to show at all → the picker (C8) */
  else{g.left=0;toast(tx().fbT)}                /* a refresh failed: keep the ideas already on screen */
 }else if(r.code==='request_unknown'){endSuggest('tExpired');return}
 else if(r.code==='suggest_limit'){g.left=0;if(!g.items)g.fallback=true}
 else{if(!g.items)g.err=true;genericToast(r.code)}
 showSuggest();
}
function endSuggest(msgKey){
 const em=S.sg&&S.sg.email;S.sg=null;
 if(!S.f.email&&em)S.f.email=em;

}
function sgSummary(){
 const g=S.sg,t=tx(),m=g&&g.sum;if(!m)return'';
 const parts=[];
 if(m.month)parts.push(monthLabel(m.month));
 parts.push(t.trav(m.travellers));
 if(m.interests.length)parts.push(m.interests.map(k=>t.ints[k]).join(', '));
 if(t.flightSum[m.maxFlight])parts.push(t.flightSum[m.maxFlight]);
 return parts.join(t.sep);
}
function pickMatches(q){
 const L=S.list||[],lang=S.lang;q=String(q||'').trim().toLowerCase();
 const res=q?L.filter(c=>String(c.he||'').toLowerCase().indexOf(q)>=0||String(c.en||'').toLowerCase().indexOf(q)>=0||c.code.toLowerCase()===q):L.filter(c=>c.popular);
 const nm=c=>String(c[lang]||c.en||'');
 const starts=c=>q&&(String(c.he||'').toLowerCase().indexOf(q)===0||String(c.en||'').toLowerCase().indexOf(q)===0)?0:1;
 res.sort((a,b)=>(starts(a)-starts(b))||((b.popular?1:0)-(a.popular?1:0))||nm(a).localeCompare(nm(b),lang));
 return res.slice(0,8);
}

 }else{
  const items=g.items||[];
  const cards=items.map(x=>{const on=g.pick===x.country,n=cName(x.country),fl=cFlag(x.country);
   return '<section class="rq-dest'+(on?' on':'')+'" data-country="'+x.country+'" aria-label="'+esc(n)+'"><div class="top">'+(fl?'<span class="flag" aria-hidden="true">'+esc(fl)+'</span>':'')+'<span class="nm">'+esc(n)+'</span></div>'+

  body=head+'<h1 class="rq-h1" id="rqTitle">'+(items.length===3?t.sgT3:t.sgT)+'</h1>'+(sum?'<p class="rq-sum">'+esc(sum)+'</p>':'')+'</div>'+
   '<div class="rq-pad" style="padding-top:12px"><div id="rqSgList" style="display:flex;flex-direction:column;gap:12px">'+cards+'</div>'+
   '<button type="button" class="rq-ghost" id="rqSgMore"'+(g.left>0&&!g.loading&&!g.busy?'':' disabled')+'>'+(g.loading?'<span class="rq-spin" style="width:16px;height:16px;border-width:2px;margin-inline-end:8px" aria-hidden="true"></span>':'')+esc(t.sgMore(g.left))+'</button>'+
   '<button type="button" class="rq-btn" id="rqSgGo"'+(g.pick&&!g.busy?'':' disabled')+'>'+esc(g.busy?t.sgGoing:g.pick?t.sgGo(cName(g.pick)):t.sgGoNone)+'</button>'+
   '<p class="rq-privacy">'+t.sgNote+'</p></div>';
 }
 paint('suggest',body);
 const list=$('rqSgList');
 if(list)list.addEventListener('click',e=>{const b=e.target.closest('button[data-pick]');if(!b||g.busy)return;g.pick=g.pick===b.dataset.pick?'':b.dataset.pick;showSuggest();const nb=app.querySelector('button[data-pick="'+b.dataset.pick+'"]');if(nb)try{nb.focus({preventScroll:true})}catch(e){}});
 const more=$('rqSgMore');if(more)more.onclick=()=>{if(g.left>0)fetchSuggest()};
 const retry=$('rqSgRetry');if(retry)retry.onclick=fetchSuggest;
 const go=$('rqSgGo');if(go)go.onclick=choose;
 const pk=$('rqPick'),pl=$('rqPickList');
 if(pk&&pl){
  const open=()=>{loadCountries().then(()=>{const r=pickMatches(pk.value);
    pl.innerHTML=r.length?r.map(c=>'<button type="button" data-code="'+c.code+'"><span aria-hidden="true">'+esc(c.flag||'')+'</span><span>'+esc(c[S.lang]||c.en)+'</span></button>').join('')
     :(String(pk.value||'').trim()?'<div class="none">'+esc(tx().noMatch)+'</div>':'');
    pl.hidden=!pl.innerHTML}).catch(()=>{pl.innerHTML='<div class="none">'+esc(tx().countriesFail)+'</div>';pl.hidden=false})};
  pk.addEventListener('focus',open);pk.addEventListener('input',open);
  pk.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=pl.querySelector('button[data-code]');if(b)b.click()}});
  pl.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
  pl.addEventListener('click',e=>{const b=e.target.closest('button[data-code]');if(!b)return;g.pick=b.dataset.code;showSuggest();const gb=$('rqSgGo');if(gb)try{gb.focus()}catch(x){}});
 }
 if(!S.list)loadCountries().then(()=>{if(S.screen==='suggest'&&S.sg===g&&!g.loading)showSuggest()}).catch(()=>{});
}
async function choose(){
 const g=S.sg;if(!g||g.busy||!g.pick)return;
 if(!online()){toast(tx().tOffline);return}
 g.busy=true;showSuggest();
 const r=await call({action:'choose',request_id:g.id,token:g.token,country:g.pick});
 if(S.sg!==g)return;
 g.busy=false;
 if(r.ok===true&&r.next==='ready'&&TOKEN_RE.test(String(r.invite_token||''))){S.sg=null;toReady(r);return}
 if(r.ok===true){   /* manual mode on the server: the request now waits for approval, with its destination */
  const f=S.hasForm?JSON.parse(JSON.stringify(S.f)):null;if(f)f.countries=[g.pick];
  S.sent={rq:{email:g.email},f:f,server:f?null:{countries:[g.pick]}};S.sg=null;showSent();return;
 }
 if(r.code==='request_unknown'){endSuggest('tExpired');return}
 showSuggest();genericToast(r.code);
}

/* ---------- F23: ready (artboard FB_Ready) ---------- */
/* CHANGE 2026-11-13 F23-REQ-17: new section (no alpha.8 equivalent). The email is verified and the invite exists: summary +
   the button into the existing /invite/ → wizard path (C3). The invite token came in the answer to this browser only; it
   is kept in sessionStorage (this tab) so a reload still shows the button. */
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
function toReady(r){
 S.ready={token:String(r.invite_token),countries:(Array.isArray(r.countries)?r.countries:[]).map(String).filter(c=>/^[A-Z]{2}$/.test(c)),
  month:typeof r.month==='string'?r.month:'',travellers:Number(r.travellers)||0,mail:r.mail_sent===true,at:Date.now(),v:1};
 ssSet(READY_KEY,JSON.stringify(S.ready));
 showReady();
}
function readReady(){
 const raw=ssGet(READY_KEY);if(!raw)return null;
 let o=null;try{o=JSON.parse(raw)}catch(e){o=null}
 if(!o||o.v!==1||!TOKEN_RE.test(String(o.token||''))||typeof o.at!=='number'||Date.now()-o.at>=READY_TTL_MS||!Array.isArray(o.countries)){ssDel(READY_KEY);return null}
 return o;
}
function showReady(){
 const t=tx(),d=S.ready;if(!d)return;
 const rows=[];
 if(d.countries.length)rows.push('<div class="rq-row"><span>'+t.rWhere+'</span><b id="rqSumWhere">'+d.countries.map(c=>esc((cFlag(c)?cFlag(c)+' ':'')+cName(c))).join(t.sep)+'</b></div>');
 rows.push('<div class="rq-row"><span>'+t.rWhen+'</span><b id="rqSumWhen">'+esc(d.month?monthLabel(String(d.month).slice(0,7)+'-01'):t.notSure)+'</b></div>');
 if(d.travellers)rows.push('<div class="rq-row"><span>'+t.rCount+'</span><b id="rqSumCount">'+esc(d.travellers)+'</b></div>');
 paint('ready','<div class="rq-bar">'+topRow()+'</div>'+
  '<div class="rq-center"><div class="rq-ring" style="background:#edf8f3">'+ICON.big+'</div><h1 id="rqTitle">'+t.rdT+'</h1><p>'+t.rdP+'</p></div>'+
  '<div class="rq-pad"><section class="rq-card" style="padding:8px 16px">'+rows.join('')+'</section>'+
  '<a class="rq-btn" id="rqStart" style="min-height:50px;font-size:15.5px" href="../invite/#invite='+encodeURIComponent(d.token)+'">'+esc(t.rdGo)+'</a>'+
  '<section class="rq-card rq-steps"><b>'+t.rdNow+'</b>'+
  '<div class="rq-tick"><span class="rq-n">1</span><span>'+(d.month?t.rd1:t.rd1b)+'</span></div>'+
  '<div class="rq-tick"><span class="rq-n">2</span><span>'+t.rd2+'</span></div>'+
  '<div class="rq-tick"><span class="rq-n">3</span><span>'+t.rd3+'</span></div></section>'+
  (d.mail?'<p class="rq-privacy" id="rqReadyMail">'+t.rdMail+'</p>':'')+'</div>');
 if(d.countries.length&&!S.list)loadCountries().then(()=>{if(S.screen==='ready')showReady()}).catch(()=>{});
}

/* ---------- boot ---------- */
/* CHANGE 2026-11-13 F23-REQ-18: what changed from alpha.8 — a ready screen saved in this tab comes first (F23); the resume
   record carries `und`. The rest of the boot order is unchanged. */
const res=readResume(),rdy=readReady();
if(rdy&&!res){
 S.ready=rdy;showReady();
}else if(res){
 if(!linkLang()&&(res.lang==='he'||res.lang==='en'))S.lang=res.lang;
 S.rq={id:res.request_id,email:res.email,sentAt:res.sentAt,lang:res.lang,und:res.u===1};S.resumed=true;
 showCode();
}else if(IN_APP&&(IS_IOS||IS_ANDROID)&&!S.inAppDone){
 showInApp(false);
}else showForm();
})();
</script>
